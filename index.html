<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bingo Musical</title>
  <style>
    /* Reset y estilos globales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      padding: 24px 20px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      transition: all 0.3s;
    }

    h1 {
      font-size: 2.2rem;
      color: #1a237e;
      margin-bottom: 8px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    h1 span {
      font-size: 2rem;
    }

    .subtitle {
      color: #3949ab;
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Configuración */
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
      background: #e8eaf6;
      padding: 12px 16px;
      border-radius: 40px;
    }

    .settings label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #1a237e;
      font-size: 0.9rem;
    }

    .settings input[type="number"] {
      width: 50px;
      padding: 6px;
      border-radius: 20px;
      border: 2px solid #5c6bc0;
      text-align: center;
      font-weight: bold;
      background: white;
    }

    .settings input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #3949ab;
      cursor: pointer;
    }

    .btn {
      background: #3949ab;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(57, 73, 171, 0.3);
      margin: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 4px rgba(57, 73, 171, 0.2);
    }

    .btn-secondary {
      background: #ff7043;
      box-shadow: 0 4px 8px rgba(255, 112, 67, 0.3);
    }

    .btn-secondary:active {
      box-shadow: 0 2px 4px rgba(255, 112, 67, 0.2);
    }

    .btn-outline {
      background: transparent;
      color: #3949ab;
      border: 2px solid #3949ab;
      box-shadow: none;
    }

    .btn-outline:active {
      background: #e8eaf6;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 16px 0 12px;
    }

    /* Cartón */
    .carton-wrapper {
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .carton-grid {
      display: grid;
      gap: 4px;
      background: #1a237e;
      padding: 6px;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
      aspect-ratio: 1 / 1;
    }

    .cell {
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: #1a237e;
      text-align: center;
      padding: 4px;
      word-break: break-word;
      transition: all 0.15s;
      cursor: pointer;
      user-select: none;
      min-height: 40px;
      border: 2px solid #c5cae9;
      line-height: 1.2;
    }

    .cell.marked {
      background: #4caf50;
      color: white;
      border-color: #2e7d32;
      position: relative;
    }
    .cell.marked::after {
      content: "✓";
      position: absolute;
      top: 2px;
      right: 6px;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.7);
    }

    .cell.free {
      background: #ffd54f;
      border-color: #f9a825;
      color: #1a237e;
      font-weight: bold;
    }
    .cell.free.marked {
      background: #4caf50;
      color: white;
      border-color: #2e7d32;
    }

    .cell:active {
      transform: scale(0.92);
    }

    /* Contador */
    .counter {
      font-size: 1.2rem;
      font-weight: 600;
      color: #1a237e;
      margin: 8px 0 4px;
    }
    .counter span {
      background: #3949ab;
      color: white;
      padding: 2px 14px;
      border-radius: 30px;
      margin-left: 8px;
    }

    /* Lista de canciones (para el DJ) */
    .song-list-toggle {
      margin-top: 10px;
    }
    .song-list {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 12px;
      max-height: 250px;
      overflow-y: auto;
      text-align: left;
      border: 2px solid #c5cae9;
      margin-top: 10px;
    }
    .song-list.open {
      display: block;
    }
    .song-item {
      padding: 6px 10px;
      border-bottom: 1px solid #e8eaf6;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .song-item .mark-btn {
      background: #e8eaf6;
      border: none;
      border-radius: 30px;
      padding: 2px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #1a237e;
    }
    .song-item .mark-btn:active {
      background: #c5cae9;
    }
    .song-item.marked-dj {
      background: #e8f5e9;
      text-decoration: line-through;
      color: #888;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #5c6bc0;
    }

    /* Responsive */
    @media (max-width: 500px) {
      .container { padding: 16px; }
      h1 { font-size: 1.8rem; }
      .cell { font-size: 0.7rem; min-height: 32px; }
      .btn { padding: 10px 18px; font-size: 1rem; }
      .settings { gap: 8px; padding: 10px; }
    }
    @media (max-width: 400px) {
      .cell { font-size: 0.6rem; min-height: 28px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <h1><span>🎵</span> Bingo Musical</h1>
    <div class="subtitle">Toca una casilla para marcarla</div>

    <!-- Configuración -->
    <div class="settings">
      <label>Dimensión:
        <input type="number" id="dimInput" value="5" min="2" max="6">
      </label>
      <label>
        <input type="checkbox" id="freeCheck"> Centro libre
      </label>
    </div>

    <div class="btn-group">
      <button class="btn" id="generateBtn">🎲 Nuevo cartón</button>
      <button class="btn btn-secondary" id="resetBtn">🔄 Reiniciar</button>
    </div>

    <!-- Cartón -->
    <div class="carton-wrapper">
      <div id="cartonContainer" class="carton-grid" style="grid-template-columns: repeat(5, 1fr);"></div>
    </div>

    <div class="counter">
      Marcadas: <span id="markedCount">0</span> / <span id="totalCells">25</span>
    </div>

    <!-- Lista de canciones para el DJ -->
    <div class="song-list-toggle">
      <button class="btn btn-outline" id="toggleSongsBtn">📜 Mostrar todas las canciones</button>
      <div id="songList" class="song-list"></div>
    </div>

    <div class="footer">
      Cada jugador usa su propio cartón · Marca las canciones que suenan
    </div>
  </div>

  <script>
    // ================================================================
    // CONFIGURACIÓN
    // ================================================================
    const CANCIONES_URL = 'canciones.json';  // Ruta a tu archivo JSON

    // Variables globales
    let canciones = [];
    let cartonActual = [];
    let marked = new Set();        // índices marcados
    let dimension = 5;
    let centroLibre = false;

    // Elementos DOM
    const dimInput = document.getElementById('dimInput');
    const freeCheck = document.getElementById('freeCheck');
    const generateBtn = document.getElementById('generateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const cartonContainer = document.getElementById('cartonContainer');
    const markedCount = document.getElementById('markedCount');
    const totalCells = document.getElementById('totalCells');
    const toggleSongsBtn = document.getElementById('toggleSongsBtn');
    const songList = document.getElementById('songList');

    // ================================================================
    // CARGAR CANCIONES
    // ================================================================
    async function loadCanciones() {
      try {
        const resp = await fetch(CANCIONES_URL);
        if (!resp.ok) throw new Error('No se pudo cargar canciones.json');
        canciones = await resp.json();
        if (!Array.isArray(canciones) || canciones.length === 0) {
          throw new Error('El archivo de canciones está vacío o mal formado');
        }
        console.log(`✅ ${canciones.length} canciones cargadas`);
        // Generar primer cartón
        generarCarton();
        actualizarUI();
        poblarListaCanciones();
      } catch (err) {
        console.error(err);
        alert('❌ Error al cargar las canciones. Asegúrate de que "canciones.json" existe y es válido.');
        // Cargar canciones de ejemplo para demostración
        canciones = [
          "Bohemian Rhapsody", "Imagine", "Hey Jude", "Like a Rolling Stone",
          "Smells Like Teen Spirit", "Hotel California", "Stairway to Heaven",
          "Wonderwall", "Comfortably Numb", "Wish You Were Here",
          "The Sound of Silence", "Fade to Black", "Nothing Else Matters",
          "Enter Sandman", "One", "Master of Puppets", "Sweet Child O' Mine",
          "November Rain", "Paradise City", "Welcome to the Jungle",
          "Back in Black", "Highway to Hell", "Thunderstruck", "You Shook Me All Night Long"
        ];
        generarCarton();
        actualizarUI();
        poblarListaCanciones();
      }
    }

    // ================================================================
    // LÓGICA DEL CARTÓN
    // ================================================================
    function generarCarton() {
      const dim = parseInt(dimInput.value) || 5;
      const free = freeCheck.checked;
      dimension = dim;
      centroLibre = free;

      const total = dim * dim;
      const necesarias = total - (free ? 1 : 0);

      if (canciones.length < necesarias) {
        alert(`⚠️ Necesitas al menos ${necesarias} canciones. Tienes ${canciones.length}.`);
        return;
      }

      // Seleccionar aleatoriamente
      const shuffled = [...canciones].sort(() => Math.random() - 0.5);
      const seleccion = shuffled.slice(0, necesarias);
      // Barajar para que no siempre estén en el mismo orden
      for (let i = seleccion.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [seleccion[i], seleccion[j]] = [seleccion[j], seleccion[i]];
      }

      // Crear cartón (rellenar por filas)
      const carton = [];
      let idx = 0;
      for (let i = 0; i < dim; i++) {
        const fila = [];
        for (let j = 0; j < dim; j++) {
          if (free && i === Math.floor(dim/2) && j === Math.floor(dim/2)) {
            fila.push(null);  // centro libre
          } else {
            fila.push(seleccion[idx++]);
          }
        }
        carton.push(fila);
      }
      cartonActual = carton;
      marked = new Set();
      actualizarUI();
      // Guardar en localStorage para persistencia
      guardarEstado();
    }

    function toggleMark(fila, col) {
      const idx = fila * dimension + col;
      // No permitir marcar el centro libre
      if (centroLibre && fila === Math.floor(dimension/2) && col === Math.floor(dimension/2)) {
        return;
      }
      if (marked.has(idx)) {
        marked.delete(idx);
      } else {
        marked.add(idx);
      }
      actualizarUI();
      guardarEstado();
    }

    function resetCarton() {
      marked = new Set();
      actualizarUI();
      guardarEstado();
    }

    // ================================================================
    // RENDERIZADO
    // ================================================================
    function actualizarUI() {
      if (!cartonActual || cartonActual.length === 0) return;
      const dim = cartonActual.length;
      cartonContainer.style.gridTemplateColumns = `repeat(${dim}, 1fr)`;
      cartonContainer.innerHTML = '';

      let total = 0;
      for (let i = 0; i < dim; i++) {
        for (let j = 0; j < dim; j++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const idx = i * dim + j;
          const valor = cartonActual[i][j];
          const isFree = (valor === null);
          const isMarked = marked.has(idx);

          if (isFree) {
            cell.textContent = '★';
            cell.classList.add('free');
          } else {
            cell.textContent = valor;
          }
          if (isMarked) {
            cell.classList.add('marked');
          }
          // Evento click
          cell.addEventListener('click', () => {
            toggleMark(i, j);
          });
          cartonContainer.appendChild(cell);
          total++;
        }
      }

      // Actualizar contador
      const marcadas = marked.size;
      markedCount.textContent = marcadas;
      totalCells.textContent = total;
    }

    // ================================================================
    // LISTA DE CANCIONES (DJ)
    // ================================================================
    function poblarListaCanciones() {
      songList.innerHTML = '';
      canciones.forEach((cancion, index) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        const span = document.createElement('span');
        span.textContent = `${index+1}. ${cancion}`;
        const btn = document.createElement('button');
        btn.className = 'mark-btn';
        btn.textContent = 'Marcar';
        btn.dataset.index = index;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Marcar/desmarcar en la lista del DJ
          item.classList.toggle('marked-dj');
          btn.textContent = item.classList.contains('marked-dj') ? 'Desmarcar' : 'Marcar';
        });
        item.appendChild(span);
        item.appendChild(btn);
        songList.appendChild(item);
      });
    }

    // ================================================================
    // PERSISTENCIA (localStorage)
    // ================================================================
    function guardarEstado() {
      try {
        const data = {
          dimension,
          centroLibre,
          carton: cartonActual,
          marked: [...marked]
        };
        localStorage.setItem('bingo_carton', JSON.stringify(data));
      } catch (e) {}
    }

    function cargarEstado() {
      try {
        const raw = localStorage.getItem('bingo_carton');
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data.carton || !data.carton.length) return false;
        dimension = data.dimension || 5;
        centroLibre = data.centroLibre || false;
        cartonActual = data.carton;
        marked = new Set(data.marked || []);
        // Sincronizar inputs
        dimInput.value = dimension;
        freeCheck.checked = centroLibre;
        return true;
      } catch (e) {
        return false;
      }
    }

    // ================================================================
    // EVENTOS
    // ================================================================
    generateBtn.addEventListener('click', () => {
      generarCarton();
    });

    resetBtn.addEventListener('click', resetCarton);

    dimInput.addEventListener('change', () => {
      generarCarton();
    });

    freeCheck.addEventListener('change', () => {
      generarCarton();
    });

    toggleSongsBtn.addEventListener('click', () => {
      songList.classList.toggle('open');
      toggleSongsBtn.textContent = songList.classList.contains('open') ? '📜 Ocultar canciones' : '📜 Mostrar todas las canciones';
    });

    // ================================================================
    // INICIO
    // ================================================================
    // Intentar cargar estado guardado, si no, generar nuevo
    const estadoCargado = cargarEstado();
    if (estadoCargado && cartonActual && cartonActual.length) {
      actualizarUI();
      // Asegurar que la lista de canciones se cargueç
      loadCanciones().then(() => {
        poblarListaCanciones();
      });
    } else {
      loadCanciones();
    }

    // Si falla la carga de canciones, igual funciona con las de ejemplo
    // (ya está manejado en loadCanciones)
  </script>
</body>
</html>
